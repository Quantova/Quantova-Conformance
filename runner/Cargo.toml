[package]
name = "qtv-conformance-runner"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
qtv-idfmt = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "67ace892ab2fdd909c7fc907c6f3e354c64e22cc" }
qtv-account = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "67ace892ab2fdd909c7fc907c6f3e354c64e22cc" }
qtv-codec = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "67ace892ab2fdd909c7fc907c6f3e354c64e22cc" }
qtv-tx = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "67ace892ab2fdd909c7fc907c6f3e354c64e22cc" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "03d1702150ed41f8db78d69affe0ce6565b1724c" }

[profile.dev.package.qtv-crypto]
opt-level = 3

[profile.test.package.qtv-crypto]
opt-level = 3
