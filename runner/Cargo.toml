[package]
name = "qtv-conformance-runner"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
qtv-idfmt = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "ead67ab92a394b8123b616bb102400471dc5fd15" }
qtv-account = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "ead67ab92a394b8123b616bb102400471dc5fd15" }
qtv-codec = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "ead67ab92a394b8123b616bb102400471dc5fd15" }
qtv-tx = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "ead67ab92a394b8123b616bb102400471dc5fd15" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "367547487c9ce07ca36293864308c117865a02ea" }

[profile.dev.package.qtv-crypto]
opt-level = 3

[profile.test.package.qtv-crypto]
opt-level = 3
