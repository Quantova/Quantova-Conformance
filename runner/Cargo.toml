[package]
name = "qtv-conformance-runner"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
qtv-idfmt = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "b2491a594a9cfe075d71a0ad85b996099eb5d7cc" }
qtv-account = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "b2491a594a9cfe075d71a0ad85b996099eb5d7cc" }
qtv-codec = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "b2491a594a9cfe075d71a0ad85b996099eb5d7cc" }
qtv-tx = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "b2491a594a9cfe075d71a0ad85b996099eb5d7cc" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "e47d6cd94e71c13b22e2990f8c2b0a2e3a2204d0" }

[profile.dev.package.qtv-crypto]
