[package]
name = "qtv-conformance-runner"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
qtv-idfmt = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "a7402fd30a0483e8e079c945f629bbec3381736e" }
qtv-account = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "a7402fd30a0483e8e079c945f629bbec3381736e" }
qtv-codec = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "a7402fd30a0483e8e079c945f629bbec3381736e" }
qtv-tx = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "a7402fd30a0483e8e079c945f629bbec3381736e" }
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "90389d03d29e42a8e2590eff2ea3957233e57aa8" }

[profile.dev.package.qtv-crypto]
opt-level = 3

[profile.test.package.qtv-crypto]
